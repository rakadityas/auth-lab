# Only the authorization server runs in a container.
#
# The demo client runs on your host (`./run-client.sh`) on purpose: your browser
# and the client must agree on ONE issuer URL. If the client lives in a container
# it resolves "localhost:8081" to itself, while your browser resolves it to the
# published Keycloak port -- and you spend an hour debugging networking instead of
# OAuth. Real deployments solve this with DNS; a laptop lab should not have to.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:z
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && echo ok"]
      interval: 5s
      timeout: 3s
      retries: 30
