<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passkey Lab</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #111; }
  h1 { font-size: 1.4rem; }
  input { font: inherit; padding: 8px; width: 100%; box-sizing: border-box; margin: 6px 0 14px; }
  button { font: inherit; padding: 9px 16px; margin-right: 8px; cursor: pointer; border: 1px solid #888; border-radius: 6px; background: #f6f6f6; }
  button:hover { background: #ececec; }
  #log { background: #0d1117; color: #c9d1d9; padding: 14px; border-radius: 8px; white-space: pre-wrap;
         font-family: ui-monospace, Menlo, monospace; font-size: 13px; min-height: 90px; margin-top: 18px; }
  .ok { color: #3fb950; } .err { color: #f85149; } .dim { color: #8b949e; }
  code { background: #eee; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<h1>🔑 Passkey / WebAuthn Lab</h1>
<p class="dim">Register a passkey (Touch ID, Windows Hello, or a security key), then
log in with it. Watch the log — every step is the real WebAuthn ceremony. No
password is ever sent, and nothing phishable leaves your device.</p>

<label>Username <input id="user" value="demo-user" autocomplete="username webauthn"></label>
<div>
  <button onclick="register()">Register a passkey</button>
  <button onclick="login()">Log in with passkey</button>
  <button onclick="whoami()">Who am I?</button>
  <button onclick="logout()">Log out</button>
</div>
<div id="log"><span class="dim">ready.</span></div>

<script>
const log = (msg, cls='') => {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
};
const clear = () => document.getElementById('log').innerHTML = '';
const user = () => encodeURIComponent(document.getElementById('user').value.trim() || 'demo-user');

// WebAuthn speaks ArrayBuffers; the JSON from the server uses base64url. These
// convert between the two. (Modern browsers have PublicKeyCredential helpers,
// but doing it by hand shows exactly what crosses the wire.)
const b64urlToBuf = s => {
  s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
  return Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
};
const bufToB64url = b =>
  btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

async function register() {
  clear();
  try {
    log('1. asking server to BEGIN registration (it invents a challenge)…', 'dim');
    let r = await fetch('/register/begin?user=' + user(), { method:'POST' });
    let opts = (await r.json()).publicKey;
    if (!opts) throw new Error('server: ' + JSON.stringify(opts));

    // Decode the fields the browser needs as binary.
    opts.challenge = b64urlToBuf(opts.challenge);
    opts.user.id = b64urlToBuf(opts.user.id);
    (opts.excludeCredentials||[]).forEach(c => c.id = b64urlToBuf(c.id));

    log('2. calling navigator.credentials.create() — approve on your device…');
    const cred = await navigator.credentials.create({ publicKey: opts });

    log('3. sending the new credential to the server to VERIFY + store…', 'dim');
    const body = {
      id: cred.id, rawId: bufToB64url(cred.rawId), type: cred.type,
      response: {
        attestationObject: bufToB64url(cred.response.attestationObject),
        clientDataJSON: bufToB64url(cred.response.clientDataJSON),
      },
    };
    r = await fetch('/register/finish?user=' + user(), {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error);
    log('✅ ' + out.status + ' — a passkey now exists for this account.', 'ok');
  } catch (e) { log('❌ ' + e.message, 'err'); }
}

async function login() {
  clear();
  try {
    log('1. asking server to BEGIN login (fresh challenge)…', 'dim');
    let r = await fetch('/login/begin?user=' + user(), { method:'POST' });
    let out = await r.json();
    if (!r.ok) throw new Error(out.error);
    let opts = out.publicKey;
    opts.challenge = b64urlToBuf(opts.challenge);
    (opts.allowCredentials||[]).forEach(c => c.id = b64urlToBuf(c.id));

    log('2. calling navigator.credentials.get() — approve on your device…');
    const assertion = await navigator.credentials.get({ publicKey: opts });

    log('3. sending the SIGNED assertion for verification…', 'dim');
    const body = {
      id: assertion.id, rawId: bufToB64url(assertion.rawId), type: assertion.type,
      response: {
        authenticatorData: bufToB64url(assertion.response.authenticatorData),
        clientDataJSON: bufToB64url(assertion.response.clientDataJSON),
        signature: bufToB64url(assertion.response.signature),
        userHandle: assertion.response.userHandle ? bufToB64url(assertion.response.userHandle) : null,
      },
    };
    r = await fetch('/login/finish?user=' + user(), {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    out = await r.json();
    if (!r.ok) throw new Error(out.error);
    log('✅ authenticated as ' + out.user + ' — the server verified the signature with your stored public key.', 'ok');
  } catch (e) { log('❌ ' + e.message, 'err'); }
}

async function whoami() {
  clear();
  const r = await fetch('/whoami');
  const out = await r.json();
  log(out.authenticated ? '✅ logged in as ' + out.user : '— not authenticated', out.authenticated ? 'ok' : 'dim');
}
async function logout() { clear(); await fetch('/logout',{method:'POST'}); log('logged out', 'dim'); }
</script>
</body>
</html>
