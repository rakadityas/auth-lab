services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://lab:lab@postgres:5432/lab
      # rbac | rebac — swap the authorization engine, same requests.
      MODEL: rebac
    depends_on:
      postgres:
        condition: service_healthy
